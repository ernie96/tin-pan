[workspace]
resolver = "3"
members = ["crates/tinpan-core", "crates/tinpan", "xtask"]

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ernie96/tin-pan"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
