[workspace]
resolver = "3"
members = ["crates/tinpan-core", "crates/tinpan", "xtask"]

[workspace.package]
version = "2.7.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ernie96/tin-pan"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Test builds keep only line numbers for Tin Pan's own code and no debug data for libraries: backtraces still
# name the line, and the debug folder stays a few GB instead of 25.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
