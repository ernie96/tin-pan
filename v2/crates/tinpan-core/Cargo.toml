[package]
name = "tinpan-core"
description = "Tin Pan's Suno client, settings and models, with no user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
sha2 = "0.10"
# Release signatures, the same Ed25519 scheme as Tin Pan 1 (update.rs).
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
iana-time-zone = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Blocking, on Tin Pan's own network thread, as fedra does; rustls with ring so no OpenSSL is needed anywhere.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent"] }

[dev-dependencies]
rand = "0.8"
aes-gcm = "0.10"
