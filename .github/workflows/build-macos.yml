name: Build 2.x for macOS

# Tests and builds Tin Pan 2 on macOS (Apple silicon) and packages Tin Pan.app in TinPan.dmg, as fedra does,
# whenever main or the macos branch changes. The DMG is kept as the run's artifact to download and try, and
# for a v2 tag it is also signed and added to that tag's release.
on:
  push:
    branches: [main, macos]
    tags: ['v2.*']
    paths: ['v2/**', '.github/workflows/build-macos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: CMake and Ninja (wxWidgets and libopus build with them)
        run: brew install cmake ninja

      # Each commit saves its own copy, so the next run starts from the newest one.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: v2-macOS-${{ hashFiles('v2/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            v2-macOS-

      - name: Test
        working-directory: v2
        run: cargo test --release -p tinpan-core -p tinpan

      # The clean-up tool, pinned to the version and file Tin Pan checks (cleanup.rs).
      - name: Fetch sunscreen
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.1 --repo abradburne/sunscreen --pattern 'sunscreen-v0.7.1-aarch64-apple-darwin.tar.gz' --dir "$RUNNER_TEMP"
          echo "722cce2a0104e345d808e407fc7fa36e3e26fe2c74fb1bda097d4a1a539dd3fa  $RUNNER_TEMP/sunscreen-v0.7.1-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c
          tar xzf "$RUNNER_TEMP/sunscreen-v0.7.1-aarch64-apple-darwin.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p target/release
          cp "$RUNNER_TEMP/sunscreen-v0.7.1-aarch64-apple-darwin/sunscreen" target/release/sunscreen

      - name: Build and package
        working-directory: v2
        run: |
          cargo build --release -p tinpan
          cargo xtask macos

      - uses: actions/upload-artifact@v4
        with:
          name: TinPan-macOS
          path: v2/target/release/TinPan.dmg
          retention-days: 30

      # A tag's build goes into its release, signed for the updater, next to TinPan.exe.
      - uses: actions/setup-dotnet@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          dotnet-version: 10.0.x

      - name: Sign it and add it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: sh v2/packaging/attach-to-release.sh v2/target/release/TinPan.dmg
